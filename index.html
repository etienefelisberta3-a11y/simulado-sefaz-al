var raw3=[["Matemática Financeira","Uma taxa efetiva trimestral de 6% equivale a uma taxa efetiva anual de 24%.","E","Taxas efetivas de períodos diferentes devem ser equivalidas por capitalização: (1,06)^4−1 ≈ 26,25%, não 24%. Multiplicar a taxa por quatro ignora juros sobre juros."],["Matemática Financeira","Em juros simples, os juros de cada período são calculados sempre sobre o capital inicial.","C","No regime simples, J=C·i·n; a base de cálculo permanece constante. A capitalização dos juros sobre o saldo acumulado é característica dos juros compostos."],["Matemática Financeira","Uma taxa real positiva pode coexistir com taxa nominal negativa, desde que a inflação seja suficientemente negativa.","C","A relação exata é (1+i_nominal)=(1+i_real)(1+inflação). Deflação intensa pode tornar a taxa nominal negativa sem impedir taxa real positiva; não se deve somar taxas como regra exata."],["Matemática Financeira","No sistema Price, a prestação é constante e a parcela de juros tende a diminuir ao longo do financiamento, se a taxa permanecer fixa.","C","A prestação é calculada para permanecer uniforme. Como os juros incidem sobre saldo devedor decrescente, a parcela de juros cai e a amortização aumenta progressivamente."],["Matemática Financeira","O valor presente de uma série postecipada é maior que o de uma série antecipada equivalente, para taxa positiva e mesmas parcelas.","E","Na série antecipada, cada pagamento ocorre um período antes. Por isso, seu valor presente é maior: VP antecipada = VP postecipada × (1+i), para a mesma série e taxa positiva."],["Direito Constitucional","A fiscalização contábil, financeira, orçamentária, operacional e patrimonial da União é exercida pelo Congresso Nacional mediante controle externo e pelo sistema de controle interno de cada Poder.","C","O art. 70 da Constituição estabelece o controle externo pelo Congresso Nacional e o controle interno de cada Poder. O TCU auxilia o Congresso, mas não substitui a titularidade constitucional do controle externo."],["Direito Constitucional","Medida provisória pode tratar de matéria reservada a lei complementar, desde que seja relevante e urgente.","E","A Constituição veda medida provisória sobre matéria reservada a lei complementar (art. 62, §1º, III). Relevância e urgência não afastam as limitações materiais expressas."],["Direito Constitucional","A administração pública direta e indireta deve observar legalidade, impessoalidade, moralidade, publicidade e eficiência.","C","São os princípios expressos no caput do art. 37 da Constituição. A incidência alcança os Poderes e entes indicados no dispositivo, não apenas a administração direta do Executivo."],["Direito Constitucional","A imunidade tributária recíproca impede, em qualquer hipótese, a cobrança de taxas entre União, estados e municípios.","E","O art. 150, VI, a, veda impostos sobre patrimônio, renda ou serviços entre os entes, não taxas indistintamente. A imunidade não elimina toda e qualquer espécie tributária."],["Direito Constitucional","A Constituição permite que lei ordinária institua empréstimo compulsório em caso de calamidade pública de grandes proporções.","E","Empréstimos compulsórios são de competência da União e dependem de lei complementar, conforme art. 148. A urgência ou a calamidade não autoriza substituir a espécie normativa exigida."],["Direito Administrativo","A anulação de ato administrativo decorre de ilegalidade, enquanto a revogação se funda em conveniência e oportunidade, respeitados os limites legais.","C","Anulação corrige vício de legalidade; revogação retira ato válido por razões de mérito administrativo. Em regra, não se revogam atos vinculados nem atos que já produziram efeitos protegidos por limites jurídicos."],["Direito Administrativo","O poder de polícia permite à administração aplicar sanções sem processo administrativo, sempre que a infração estiver comprovada.","E","A imposição de sanções deve respeitar contraditório, ampla defesa e devido processo, ressalvadas medidas cautelares legalmente justificadas. Comprovação da infração não elimina garantias procedimentais."],["Direito Administrativo","A responsabilidade civil objetiva do Estado exige, em regra, conduta estatal, dano e nexo causal, sem exigir prova de culpa do agente pela vítima.","C","O art. 37, §6º, da Constituição adota responsabilidade objetiva das pessoas jurídicas prestadoras de serviço público. A discussão de culpa pode surgir em regresso contra o agente, não como requisito geral da vítima."],["Direito Administrativo","A convalidação pode sanar qualquer vício de competência, inclusive quando a competência for exclusiva, e qualquer vício de finalidade.","E","A convalidação não alcança vício de finalidade nem competência exclusiva. Em regra, admite-se para defeitos sanáveis, como certos vícios de competência não exclusiva e de forma, desde que não haja lesão ao interesse público ou a terceiros."],["Direito Administrativo","Na contratação pública, o planejamento é etapa dispensável quando o objeto possui especificações usuais de mercado.","E","A simplicidade ou padronização do objeto não elimina o dever de planejamento. A Lei 14.133/2021 estrutura a contratação pública com fase preparatória e definição da necessidade, solução e condições da contratação."],["Contabilidade Geral","A aquisição de equipamento à vista troca um ativo por outro e, no instante do reconhecimento, não reduz necessariamente o patrimônio líquido.","C","O caixa diminui e o imobilizado aumenta pelo valor reconhecido. Sem depreciação, perda ou outro efeito, a operação é permutativa e não gera despesa imediata pelo valor integral do bem."],["Contabilidade Geral","A depreciação acumulada é uma conta de passivo, pois representa obrigação futura de substituir o imobilizado.","E","Depreciação acumulada é conta redutora do ativo imobilizado, não passivo. Ela acumula a alocação sistemática do valor depreciável ao longo da vida útil e não representa, por si, caixa reservado para reposição."],["Contabilidade Geral","O reconhecimento de receita pelo regime de competência pode ocorrer antes do recebimento em dinheiro, se os critérios de reconhecimento forem atendidos.","C","Competência não se confunde com regime de caixa. Quando a obrigação de desempenho é satisfeita e os critérios contábeis são atendidos, pode haver receita e direito a receber antes da entrada financeira."],["Contabilidade Geral","O aumento de uma conta de despesa é registrado, normalmente, a crédito, porque diminui o patrimônio líquido.","E","Despesas normalmente aumentam por débito e reduzem o resultado, que afeta o patrimônio líquido. O fato de o efeito econômico ser redutor não transforma o lançamento em crédito."],["Contabilidade Geral","Uma provisão se distingue de passivo contingente porque, em regra, é reconhecida quando há obrigação presente, saída provável de recursos e estimativa confiável.","C","Esses são critérios centrais de reconhecimento de provisão. Passivo contingente não é reconhecido como passivo quando não atende aos critérios, embora possa exigir divulgação, conforme a probabilidade e as regras aplicáveis."],["Direito Tributário","A obrigação tributária principal surge com a ocorrência do fato gerador e tem por objeto o pagamento de tributo ou penalidade pecuniária.","C","Nos termos do CTN, a obrigação principal nasce com o fato gerador e extingue-se com o crédito dela decorrente. A penalidade pecuniária integra a obrigação principal, embora multa não seja tributo."],["Direito Tributário","A obrigação acessória, quando descumprida, converte-se em obrigação principal relativamente à penalidade pecuniária.","C","O art. 113, §3º, do CTN prevê essa conversão quanto à penalidade. O dever instrumental original não vira tributo; o descumprimento gera obrigação principal quanto à multa."],["Direito Tributário","A capacidade tributária passiva depende necessariamente da capacidade civil plena da pessoa natural.","E","O art. 126 do CTN afasta essa exigência. Capacidade tributária passiva independe da capacidade civil e de restrições ao exercício de atividades, nos termos legais."],["Direito Tributário","A responsabilidade tributária de terceiro pode ser atribuída livremente por contrato privado, mesmo sem previsão legal.","E","A responsabilidade tributária depende de lei, conforme o CTN. Convenções particulares podem disciplinar quem suportará economicamente o tributo entre as partes, mas não alteram, por si, a definição legal do sujeito passivo perante o Fisco."],["Direito Tributário","A isenção e a imunidade são institutos equivalentes, pois ambas decorrem diretamente de norma constitucional.","E","Imunidade é limitação constitucional à competência tributária. Isenção é benefício previsto em lei infraconstitucional, que dispensa o pagamento em situações legalmente definidas; suas estruturas e consequências são distintas."],["Direito Tributário","O lançamento tributário é atividade administrativa vinculada e obrigatória, sob pena de responsabilidade funcional, quando presentes os pressupostos legais.","C","O art. 142 do CTN atribui à autoridade administrativa a constituição do crédito pelo lançamento, atividade vinculada. Não se trata de escolha livre baseada em conveniência."],["Direito Tributário","A denúncia espontânea exclui a responsabilidade por infração quando feita antes de qualquer procedimento fiscal relacionado, acompanhada, quando cabível, do pagamento do tributo e juros.","C","O art. 138 do CTN exige espontaneidade e, se o tributo depender de pagamento, recolhimento com juros. A exclusão não se aplica depois do início de procedimento administrativo ou medida de fiscalização relacionada à infração."],["Direito Tributário","A prescrição tributária extingue o direito de a Fazenda constituir o crédito tributário ainda não lançado.","E","A decadência é, em regra, a perda do direito de constituir o crédito. A prescrição atinge a pretensão de cobrança judicial do crédito definitivamente constituído, observados os marcos e causas legais."],["Direito Tributário","A moratória pode ser concedida em caráter geral ou individual, observados os requisitos e limites estabelecidos em lei.","C","O CTN disciplina a moratória como hipótese de suspensão da exigibilidade e admite concessão geral ou individual nos termos legais. A concessão individual não gera direito adquirido se os requisitos não forem cumpridos."],["Direito Tributário","A interpretação literal prevista no CTN aplica-se indistintamente a toda legislação tributária, sem exceções.","E","O art. 111 exige interpretação literal em matérias específicas, como suspensão ou exclusão do crédito, outorga de isenção e dispensa de obrigações acessórias. Não é regra geral para todo o Direito Tributário."],["Estatística e Probabilidade","A mediana é menos sensível a valores extremos do que a média aritmética.","C","A mediana depende da posição central dos dados ordenados, enquanto a média incorpora a magnitude de cada observação. Um valor muito elevado pode deslocar bastante a média sem alterar muito a mediana."],["Estatística e Probabilidade","A variância é expressa na mesma unidade de medida da variável original.","E","A variância é calculada com desvios ao quadrado e, portanto, fica na unidade ao quadrado. O desvio-padrão, raiz quadrada da variância, retorna à unidade original."],["Estatística e Probabilidade","Se dois eventos são independentes, a ocorrência de um não altera a probabilidade do outro.","C","Independência significa P(A∩B)=P(A)P(B), ou, quando a condição é definida, P(A|B)=P(A). Não deve ser confundida com eventos mutuamente exclusivos, que não podem ocorrer juntos."],["Estatística e Probabilidade","A probabilidade condicional P(A|B) é igual a P(A∩B)/P(B), desde que P(B) seja positiva.","C","A fórmula divide a probabilidade de ambos ocorrerem pela probabilidade da condição B. O denominador precisa ser positivo para que a probabilidade condicional esteja definida dessa forma."],["Estatística e Probabilidade","Em uma distribuição normal, média, mediana e moda coincidem.","C","A normal é simétrica e unimodal, com os três indicadores no centro da distribuição. Essa propriedade não se aplica a toda distribuição simétrica ou a toda distribuição unimodal."],["Estatística e Probabilidade","Aumentar o tamanho da amostra garante que qualquer estimador se torne não viesado.","E","Tamanho amostral maior pode reduzir variabilidade, mas não elimina automaticamente viés sistemático. Não viés é propriedade do estimador e do procedimento de amostragem, não consequência necessária do número de observações."],["Estatística e Probabilidade","O erro-padrão da média, sob condições usuais, diminui proporcionalmente à raiz quadrada do tamanho amostral.","C","Para observações independentes com desvio-padrão populacional σ, o erro-padrão é σ/√n. Para reduzi-lo à metade, em condições semelhantes, é necessário quadruplicar n."],["Estatística e Probabilidade","Um intervalo de confiança de 95% significa que, após calcular um intervalo específico, há 95% de probabilidade de o parâmetro fixo estar nele.","E","Na interpretação frequentista, o parâmetro é fixo; 95% refere-se à proporção de intervalos que conteriam o parâmetro em repetidas amostragens pelo mesmo método. Não é a probabilidade posterior do parâmetro dentro deste intervalo já calculado."],["Estatística e Probabilidade","Correlação igual a zero prova que duas variáveis são independentes.","E","Correlação nula indica ausência de associação linear, mas pode haver dependência não linear. Independência implica correlação zero sob condições de existência dos momentos, porém a recíproca não é geral."],["Estatística e Probabilidade","Em uma distribuição binomial, o número de tentativas é fixo e cada tentativa tem dois resultados possíveis, com probabilidade de sucesso constante e independência.","C","Esses são os pressupostos clássicos do modelo binomial. Se a probabilidade varia entre tentativas ou os resultados não são independentes, a distribuição binomial simples pode não ser apropriada."],["Contabilidade Pública","No enfoque orçamentário, a receita é reconhecida quando arrecadada, enquanto a despesa é reconhecida quando legalmente empenhada.","C","A Lei 4.320/1964 adota, para execução orçamentária, a arrecadação como estágio de realização da receita e o empenho como estágio da despesa. Isso não elimina o regime de competência patrimonial para variações patrimoniais."],["Contabilidade Pública","O empenho da despesa consiste na verificação do direito adquirido pelo credor com base em documentos comprobatórios do crédito.","E","Essa descrição corresponde à liquidação. Empenho é o ato que cria para o Estado obrigação de pagamento, pendente ou não de condição, e reserva dotação para a despesa."],["Contabilidade Pública","Restos a pagar processados são despesas empenhadas e liquidadas, mas ainda não pagas até o encerramento do exercício.","C","A liquidação reconhece o direito do credor após verificação do objeto e dos documentos. Se ainda não ocorreu pagamento no encerramento, a despesa liquidada entra como resto a pagar processado."],["Contabilidade Pública","A inscrição em restos a pagar não processados indica que a despesa já foi liquidada e o direito do credor foi verificado.","E","Não processados são empenhados, mas ainda não liquidados. A liquidação é o marco que distingue os processados dos não processados."],["Contabilidade Pública","O balanço patrimonial do setor público apresenta ativos, passivos e patrimônio líquido, além de quadros auxiliares previstos nas normas aplicáveis.","C","O balanço patrimonial evidencia a posição patrimonial na data-base. A estrutura pública inclui quadros específicos, como ativos e passivos financeiros e permanentes, conforme a legislação e o MCASP."],["Contabilidade Pública","A variação patrimonial aumentativa deve ser reconhecida exclusivamente quando houver ingresso de caixa.","E","O reconhecimento patrimonial segue a competência e os critérios de ocorrência do fato gerador, não apenas o caixa. Uma receita patrimonial pode ser reconhecida antes do recebimento, se houver direito e condições de reconhecimento."],["Contabilidade Pública","O suprimento de fundos é uma forma excepcional de adiantamento a servidor, sujeita a hipóteses legais, prestação de contas e controles.","C","Não é mecanismo ordinário para evitar licitação ou controles. Sua utilização depende de previsão normativa, finalidade autorizada e posterior comprovação da aplicação dos recursos."],["Contabilidade Pública","A despesa pública pode ser paga antes do empenho, desde que a autoridade competente autorize posteriormente a regularização.","E","A execução regular exige prévio empenho, nos termos da Lei 4.320/1964. Autorização posterior não transforma em regular o pagamento feito sem observância da sequência legal."],["Contabilidade Pública","A depreciação de um bem público pode gerar variação patrimonial diminutiva sem representar saída de caixa no mesmo momento.","C","A depreciação reconhece o consumo do potencial de serviço do ativo ao longo do tempo. É lançamento patrimonial sem pagamento simultâneo, distinto da execução orçamentária de despesa."],["Contabilidade Pública","O crédito adicional suplementar destina-se a reforçar dotação orçamentária já existente.","C","Suplementar reforça dotação insuficiente; especial atende despesa sem dotação específica; extraordinário atende despesas urgentes e imprevisíveis nos termos constitucionais. A classificação é definida pela finalidade do crédito."],["Economia","Em concorrência perfeita, uma firma individual é tomadora de preços e escolhe a quantidade que maximiza o lucro comparando preço e custo marginal.","C","A firma não determina o preço de mercado; no modelo competitivo, maximiza lucro produzindo onde P=CMg, desde que a produção seja economicamente viável no curto prazo."],["Economia","Um aumento da renda dos consumidores desloca necessariamente a demanda de qualquer bem para a direita.","E","O efeito depende do tipo de bem. A demanda por bens normais tende a aumentar com a renda, mas a de bens inferiores pode diminuir. A palavra 'qualquer' torna o item incorreto."],["Economia","Elasticidade-preço da demanda mede a variação percentual da quantidade demandada em resposta à variação percentual do preço.","C","A medida é a razão entre variações percentuais, normalmente com sinal negativo para demanda ordinária. Em valor absoluto maior que um, a demanda é elástica; menor que um, inelástica."],["Economia","A elevação da taxa de juros tende, mantidas as demais condições, a desestimular investimento financiado e consumo intertemporal.","C","Juros maiores elevam o custo de oportunidade e de financiamento, reduzindo projetos cujo retorno esperado não cobre o custo do capital. O efeito concreto depende de expectativas, crédito e outras condições."],["Economia","O PIB nominal elimina o efeito das mudanças de preços ao comparar diferentes anos.","E","PIB nominal usa preços correntes. Para separar a variação de preços, utiliza-se o PIB real, calculado com preços constantes ou metodologia de encadeamento."],["Economia","Uma política fiscal expansionista pode elevar a demanda agregada no curto prazo, embora seus efeitos dependam da conjuntura e da reação monetária.","C","Aumento de gastos ou redução de tributos pode estimular demanda. O resultado pode ser menor se houver restrições de oferta, resposta monetária, importações ou expectativas que neutralizem parte do impulso."],["Economia","Inflação de demanda ocorre quando a pressão sobre a demanda agregada supera a capacidade de oferta da economia.","C","A demanda maior que a capacidade produtiva tende a pressionar preços. Não se confunde com inflação de custos, ligada, por exemplo, a choques de energia ou salários."],["Economia","Uma desvalorização cambial torna necessariamente todos os bens domésticos mais baratos para os residentes.","E","A desvalorização encarece moeda estrangeira em moeda nacional e pode elevar o preço interno de importados e insumos importados. Pode favorecer exportadores, mas não barateia todos os bens domésticos."],["Economia","O desemprego friccional pode ocorrer mesmo em uma economia próxima do pleno emprego, devido ao tempo de busca e transição entre postos.","C","Esse desemprego decorre de movimentação no mercado de trabalho e busca por melhor compatibilidade entre trabalhador e vaga. Pleno emprego não significa desemprego zero."],["Economia","O multiplicador fiscal tende a ser maior quanto menor for a propensão marginal a consumir.","E","No modelo simples, maior propensão marginal a consumir amplia rodadas sucessivas de gasto; a propensão a poupar reduz o multiplicador. A magnitude real também depende de impostos, importações e política monetária."],["Finanças Públicas","A função alocativa do Estado relaciona-se à oferta de bens públicos e à correção de falhas de mercado.","C","Bens públicos e externalidades podem levar a provisão privada insuficiente ou ineficiente. A função alocativa busca direcionar recursos para melhorar a alocação, sem significar que toda atividade deva ser estatal."],["Finanças Públicas","A função distributiva da política fiscal busca alterar a distribuição de renda e oportunidades por meio de tributos e gastos públicos.","C","Tributação progressiva e transferências são exemplos. A avaliação exige considerar tanto o lado da receita quanto o da despesa e seus efeitos sobre eficiência e incentivos."],["Finanças Públicas","A função estabilizadora consiste exclusivamente em financiar infraestrutura de longo prazo.","E","A estabilização procura suavizar flutuações do ciclo, apoiar emprego e estabilidade de preços e demanda. Infraestrutura se relaciona mais diretamente à alocação e ao desenvolvimento de longo prazo."],["Finanças Públicas","Déficit primário é calculado sem incluir os juros nominais da dívida pública.","C","O resultado primário compara receitas e despesas primárias, excluindo juros da dívida. O resultado nominal incorpora os juros conforme a metodologia fiscal adotada."],["Finanças Públicas","A emissão de dívida pública não cria obrigação futura para o governo, pois representa apenas receita orçamentária corrente.","E","O endividamento fornece financiamento presente, mas gera obrigação de serviço e resgate futuros. Deve ser analisado com custos, prazos, riscos e sustentabilidade fiscal."],["Finanças Públicas","A Lei de Responsabilidade Fiscal exige planejamento, transparência, prevenção de riscos e correção de desvios que afetem o equilíbrio fiscal.","C","Esses são pilares da LRF. Instrumentos como metas fiscais, relatórios e limites de despesa e dívida buscam responsabilidade na gestão, sem impedir toda variação de gasto."],["Finanças Públicas","A renúncia de receita pode exigir estimativa de impacto e medidas de compensação, observadas as hipóteses e requisitos da LRF.","C","O art. 14 da LRF disciplina a concessão ou ampliação de incentivo ou benefício tributário. Há requisitos específicos e exceções legais; não é correto tratar renúncia como decisão sem avaliação fiscal."],["Finanças Públicas","A regra de ouro veda, sem qualquer exceção, operações de crédito superiores às despesas de capital em todos os exercícios e circunstâncias.","E","A Constituição contém a regra de ouro, mas admite exceção mediante créditos suplementares ou especiais com finalidade precisa, aprovados pelo Legislativo por maioria absoluta. A afirmação absoluta ignora a exceção constitucional."],["Finanças Públicas","O orçamento público é instrumento de planejamento e autorização, e sua execução deve respeitar as dotações e regras legais aplicáveis.","C","O orçamento organiza receitas e despesas e autoriza a execução dentro dos limites previstos. A existência de dotação não dispensa empenho, licitação ou outras exigências legais."],["Finanças Públicas","A classificação funcional da despesa identifica a área de atuação governamental, como saúde ou educação, independentemente do órgão executor.","C","Função e subfunção permitem identificar finalidade da despesa. A classificação institucional, por outro lado, indica órgão e unidade orçamentária responsável."],["Legislação Tributária Estadual","O ICMS é imposto de competência dos estados e do Distrito Federal, observadas as normas constitucionais e a lei complementar nacional.","C","A competência decorre do art. 155, II, da Constituição. A legislação estadual disciplina aspectos dentro dos limites constitucionais e das normas gerais nacionais."],["Legislação Tributária Estadual","A não cumulatividade do ICMS assegura, em termos gerais, compensação do imposto devido em cada operação com o montante cobrado nas anteriores, nos limites legais.","C","O mecanismo evita tributação cumulativa ao longo da cadeia. O creditamento depende das condições constitucionais e legais; não é uma autorização irrestrita para aproveitar qualquer valor destacado."],["Legislação Tributária Estadual","O ICMS incide sobre toda e qualquer transferência de mercadoria entre estabelecimentos do mesmo titular, ainda que não haja circulação jurídica.","E","A mera transferência entre estabelecimentos do mesmo titular, sem transferência de titularidade, não configura fato gerador do ICMS conforme a orientação vinculante do STF. Permanecem regras sobre transferência de créditos previstas na legislação aplicável."],["Legislação Tributária Estadual","A substituição tributária para frente envolve recolhimento antecipado relativo a operações subsequentes presumidas, conforme disciplina legal.","C","Um responsável recolhe o imposto de etapas futuras com base em valor presumido. O regime depende de previsão normativa e possui regras de restituição quando o fato presumido não se realiza, conforme o sistema constitucional e legal."],["Legislação Tributária Estadual","A imunidade constitucional de livros, jornais e periódicos abrange automaticamente qualquer produto digital ou serviço comercializado junto com eles.","E","A extensão depende do conteúdo e do enquadramento constitucional e jurisprudencial, não sendo correto afirmar cobertura automática de todo serviço associado. Imunidade não se presume para qualquer operação comercial vinculada."],["Legislação Tributária Estadual","O domicílio tributário do contribuinte pode ser eleito nos termos do CTN, mas a autoridade pode recusá-lo nas hipóteses legais que dificultem ou impossibilitem a arrecadação ou fiscalização.","C","O CTN admite eleição de domicílio e prevê atuação da autoridade quando a escolha prejudica controle ou cobrança. Não é liberdade absoluta nem escolha sempre irrevogável."],["Legislação Tributária Estadual","A obrigação de emitir documento fiscal pode existir mesmo quando a operação goza de benefício fiscal, conforme a legislação estadual.","C","Benefício relativo ao pagamento não elimina automaticamente deveres instrumentais. Obrigações acessórias podem ser exigidas para controle, fiscalização e comprovação do enquadramento tributário."],["Legislação Tributária Estadual","A solidariedade tributária admite benefício de ordem entre os coobrigados em todos os casos.","E","O art. 124, parágrafo único, do CTN estabelece que a solidariedade tributária não comporta benefício de ordem. A Fazenda pode exigir o crédito de qualquer dos solidários, nos limites legais."],["Legislação Tributária Estadual","A consulta tributária formal pode produzir efeitos protetivos ao consulente se observados os requisitos e o procedimento previstos na legislação pertinente.","C","A consulta é instrumento para esclarecer interpretação da norma e pode suspender ou afastar determinados efeitos durante o prazo legal. Os efeitos dependem da legislação aplicável e da correspondência entre os fatos declarados e a situação real."],["Legislação Tributária Estadual","A fiscalização estadual pode exigir qualquer informação protegida por sigilo sem observar os requisitos legais de acesso e utilização.","E","Poderes de fiscalização são amplos, mas não ilimitados. Sigilos e dados protegidos exigem base legal, finalidade e procedimentos pertinentes, e a informação obtida deve ser utilizada nos limites autorizados."],["Inteligência Artificial","Em aprendizado supervisionado, o treinamento utiliza exemplos associados a rótulos ou valores-alvo conhecidos.","C","O modelo aprende a relacionar atributos de entrada e saídas conhecidas. Classificação e regressão são tarefas supervisionadas, diferentemente do agrupamento não supervisionado."],["Inteligência Artificial","Um modelo com desempenho muito alto nos dados de treinamento necessariamente generaliza bem para dados novos.","E","Desempenho de treino pode refletir sobreajuste. A generalização deve ser avaliada com dados separados e procedimentos adequados, sem vazamento de informação."],["Inteligência Artificial","A divisão entre treino, validação e teste ajuda a separar ajuste de parâmetros, seleção de modelo e avaliação final.","C","O conjunto de treino ajusta o modelo, a validação apoia escolhas e o teste estima desempenho final. Usar repetidamente o teste para escolher modelos contamina sua independência."],["Inteligência Artificial","Em classificação desbalanceada, acurácia elevada pode ocultar desempenho ruim na classe minoritária.","C","Se quase todos os casos pertencem à classe majoritária, prever sempre essa classe pode gerar acurácia alta e recall nulo para a classe rara. Matriz de confusão, precisão, recall e F1 podem ser mais informativos."],["Inteligência Artificial","A precisão (precision) é a proporção de positivos previstos que realmente são positivos.","C","Precision = VP/(VP+FP). Já recall = VP/(VP+FN). A banca pode trocar os denominadores, por isso é importante identificar se a pergunta parte das previsões positivas ou dos positivos reais."],["Inteligência Artificial","A regularização busca reduzir complexidade ou magnitude dos parâmetros para ajudar a controlar sobreajuste.","C","Penalizações como L1 e L2 acrescentam custo à função objetivo e podem limitar modelos excessivamente ajustados ao treino. O efeito depende da escolha do parâmetro de regularização."],["Inteligência Artificial","A normalização de atributos deve ser calculada usando conjuntamente treino e teste para evitar diferenças de escala entre eles.","E","Parâmetros de transformação devem ser ajustados apenas no treino e depois aplicados à validação/teste. Ajustar com todo o conjunto revela informação do teste e causa vazamento de dados."],["Inteligência Artificial","Uma rede neural profunda é sempre mais interpretável e menos custosa que um modelo linear simples.","E","Redes profundas podem capturar padrões complexos, mas tendem a exigir mais dados e recursos e podem ser menos interpretáveis. A adequação depende da tarefa, do custo e dos requisitos de explicabilidade."],["Inteligência Artificial","Viés algorítmico pode surgir de dados históricos não representativos, rótulos enviesados ou escolhas inadequadas de modelagem.","C","O algoritmo não é neutro apenas por ser matemático. Dados e objetivos refletem decisões humanas e estruturas sociais; avaliação por subgrupos e governança ajudam a identificar riscos."],["Inteligência Artificial","Em sistemas generativos, uma resposta fluente é garantia de que o conteúdo é factual e está apoiado em fontes verificadas.","E","Modelos generativos podem produzir conteúdo plausível, porém incorreto ou inventado. Fluência não substitui validação, rastreabilidade e conferência em fontes confiáveis."],["Desenvolvimento de Sistemas","Em orientação a objetos, encapsulamento reúne estado e comportamento e controla o acesso aos detalhes internos do objeto.","C","A interface pública permite uso sem expor a implementação. Encapsular não significa necessariamente esconder tudo, mas definir limites de acesso e preservar invariantes do objeto."],["Desenvolvimento de Sistemas","A herança é sempre preferível à composição porque elimina acoplamento entre classes.","E","Herança cria relação hierárquica e pode aumentar acoplamento. Composição costuma favorecer flexibilidade quando um objeto utiliza outro, mas a escolha depende da relação semântica e dos requisitos."],["Desenvolvimento de Sistemas","Uma transação ACID deve respeitar atomicidade, consistência, isolamento e durabilidade.","C","Atomicidade trata de tudo ou nada; consistência preserva regras; isolamento controla interferência concorrente; durabilidade mantém o resultado confirmado após falhas."],["Desenvolvimento de Sistemas","Uma chave estrangeira serve para garantir unicidade dos valores da própria coluna em qualquer tabela.","E","A chave estrangeira referencia uma chave candidata ou primária em outra tabela e preserva integridade referencial. Unicidade é função típica de chave primária ou restrição UNIQUE."],["Desenvolvimento de Sistemas","Uma API REST bem projetada pode usar métodos HTTP com semântica apropriada, como GET para leitura e POST para criação ou processamento.","C","Métodos têm semânticas padronizadas: GET é seguro e deve ser idempotente; PUT normalmente substitui representação e é idempotente; POST não é necessariamente idempotente. O desenho deve respeitar essas expectativas."],["Desenvolvimento de Sistemas","Testes unitários substituem integralmente testes de integração, pois cobrem todos os defeitos entre componentes.","E","Testes unitários isolam unidades e não garantem que módulos funcionem juntos. Integração, sistema e aceitação detectam classes diferentes de defeitos; a estratégia é complementar."],["Desenvolvimento de Sistemas","Em integração contínua, mudanças são integradas frequentemente e submetidas a verificações automatizadas para detectar problemas cedo.","C","Builds e testes automatizados fornecem feedback rápido. Integração contínua não garante ausência de defeitos, mas reduz o custo de descobrir conflitos tardiamente."],["Desenvolvimento de Sistemas","Uma consulta SQL com condição WHERE aplicada após uma agregação é sempre equivalente a HAVING.","E","WHERE filtra linhas antes do agrupamento; HAVING filtra grupos após agregação. Podem coincidir em alguns casos, mas não são equivalentes em geral."],["Desenvolvimento de Sistemas","A normalização relacional busca reduzir redundância e anomalias de inserção, atualização e exclusão.","C","Formas normais organizam dependências e relacionamentos. Normalizar não significa eliminar toda redundância em qualquer contexto; decisões de desempenho podem justificar desnormalização controlada."],["Desenvolvimento de Sistemas","Em arquitetura baseada em microsserviços, cada serviço precisa obrigatoriamente possuir um banco físico separado em servidor próprio.","E","A autonomia de dados é uma recomendação arquitetural importante, mas não exige um servidor físico exclusivo por serviço. O desenho depende de isolamento, consistência, escala e operação; a afirmação é excessivamente absoluta."],["Infraestrutura de TIC e Segurança","O princípio do menor privilégio concede a cada identidade apenas as permissões necessárias para suas funções.","C","A redução de privilégios limita o impacto de credenciais comprometidas e de erros. As permissões devem ser revisadas e removidas quando deixam de ser necessárias."],["Infraestrutura de TIC e Segurança","Criptografia de dados em repouso elimina a necessidade de controlar quem acessa o sistema após a autenticação.","E","Criptografia protege confidencialidade dos dados armazenados, mas não substitui autenticação, autorização, monitoramento e gestão de chaves. Um usuário autorizado indevidamente ou uma chave comprometida ainda pode expor informações."],["Infraestrutura de TIC e Segurança","Hash criptográfico e criptografia simétrica são equivalentes, pois ambos permitem recuperar o texto original com uma chave secreta.","E","Hash é, em regra, função unidirecional e não se destina à recuperação do original. Criptografia simétrica usa chave para cifrar e decifrar dados."],["Infraestrutura de TIC e Segurança","Autenticação multifator combina fatores de categorias distintas, como conhecimento, posse e inerência.","C","Dois fatores da mesma categoria não constituem necessariamente MFA. Senha e PIN são ambos fatores de conhecimento; senha e token de posse formam categorias distintas."],["Infraestrutura de TIC e Segurança","Um backup só pode ser considerado confiável se houver teste periódico de restauração e controle de integridade.","C","A existência do arquivo não garante recuperação. Testes verificam se os dados são utilizáveis e se o tempo de recuperação atende aos objetivos operacionais."],["Infraestrutura de TIC e Segurança","A segmentação de rede pode limitar movimento lateral de um invasor e reduzir a superfície de exposição entre ambientes.","C","Separar redes e aplicar regras de comunicação impede que o comprometimento de um segmento dê acesso irrestrito aos demais. A segmentação deve ser combinada com monitoramento e controles de identidade."],["Infraestrutura de TIC e Segurança","Uma vulnerabilidade zero-day é necessariamente uma falha para a qual já existe correção amplamente instalada.","E","Zero-day refere-se a falha explorada ou desconhecida pelo fornecedor/defensor antes de haver correção disponível ou tempo suficiente para aplicá-la, conforme o contexto. Não significa patch amplamente instalado."],["Infraestrutura de TIC e Segurança","O princípio de disponibilidade envolve manter sistemas e informações acessíveis quando necessários aos usuários autorizados.","C","Disponibilidade integra a tríade confidencialidade, integridade e disponibilidade. Redundância, continuidade, monitoramento e recuperação ajudam a reduzir interrupções."],["Infraestrutura de TIC e Segurança","A assinatura digital com criptografia assimétrica pode apoiar autenticidade e integridade, mas não garante por si só que o conteúdo assinado seja verdadeiro.","C","A assinatura vincula o documento à chave privada e permite detectar alterações, sob condições de validação. Ela não certifica a veracidade material das declarações nem dispensa confiança na gestão de chaves e certificados."],["Infraestrutura de TIC e Segurança","A resposta a incidentes deve preservar evidências e registrar ações, além de conter e erradicar a ameaça.","C","A documentação e a cadeia de custódia podem ser essenciais para investigação e responsabilização. A resposta precisa equilibrar contenção, recuperação, preservação de evidências e comunicação."],["Reforma Tributária","A Emenda Constitucional 132/2023 instituiu a base constitucional para a criação do IBS e da CBS no modelo de tributação sobre o consumo.","C","A reforma alterou a Constituição para reorganizar tributos sobre consumo. A implementação depende também de legislação complementar e regras de transição; não se deve tratar a mudança constitucional como sistema integralmente operacional desde sua promulgação."],["Reforma Tributária","O IBS é tributo de competência compartilhada entre estados, Distrito Federal e municípios.","C","O desenho constitucional atribui competência compartilhada aos entes subnacionais. A governança e a administração são estruturadas nacionalmente, sem transformar o IBS em imposto de competência exclusiva da União."],["Reforma Tributária","A CBS é contribuição de competência dos estados, destinada a substituir o ICMS e o ISS.","E","A CBS é contribuição federal e integra a substituição de tributos federais sobre consumo, como PIS/Cofins. O IBS é o tributo subnacional relacionado à substituição gradual de ICMS e ISS."],["Reforma Tributária","O princípio do destino busca direcionar a arrecadação ao local de consumo, em contraste com a tributação concentrada na origem.","C","A lógica do destino reduz incentivos à guerra fiscal baseada na origem e aproxima a receita do local de consumo. A aplicação concreta depende de regras de localização e transição definidas na legislação."],["Reforma Tributária","A não cumulatividade ampla no modelo de IVA permite créditos relativos a aquisições vinculadas à atividade, observadas as exceções legais.","C","A ideia é tributar o valor agregado e reduzir cumulatividade. Não significa crédito irrestrito para qualquer despesa pessoal ou operação; as condições, exceções e vedações legais continuam relevantes."],["Reforma Tributária","A reforma elimina imediatamente todos os tributos atuais sobre consumo no mesmo dia em que a emenda constitucional entrou em vigor.","E","A reforma prevê transição gradual, com coexistência de tributos antigos e novos por período definido. A implantação envolve fases, testes e alterações progressivas, não substituição instantânea."],["Reforma Tributária","A existência de alíquotas de referência não impede que a legislação estabeleça tratamentos diferenciados nos casos constitucionalmente autorizados.","C","O modelo contempla alíquotas de referência e regimes diferenciados ou específicos previstos constitucionalmente e em lei complementar. A extensão do benefício depende de autorização normativa, não de decisão administrativa livre."],["Reforma Tributária","O Imposto Seletivo tem finalidade relacionada a bens e serviços prejudiciais à saúde ou ao meio ambiente, nos termos constitucionais e legais.","C","O IS possui finalidade extrafiscal associada a externalidades negativas e incide sobre itens definidos em lei. Não é correto presumir que qualquer produto possa ser incluído sem observar o desenho legal."],["Reforma Tributária","A CBS e o IBS possuem necessariamente bases de cálculo e regras idênticas em todos os aspectos, sem qualquer particularidade legal.","E","O sistema busca harmonização e regras comuns, mas os tributos têm competências e disciplina normativa próprias. A afirmação de identidade absoluta ignora diferenças previstas no texto constitucional e na legislação complementar."],["Reforma Tributária","A reforma tributária pode alterar a distribuição de receitas entre entes e por isso prevê mecanismos de transição e compensação.","C","A mudança da origem para o destino e a substituição de tributos afetam repartição federativa. Regras de transição buscam amortecer perdas e adaptar a distribuição ao novo sistema."],["Reforma Tributária","O crédito de IBS ou CBS pode ser utilizado sem documentação fiscal idônea, porque a não cumulatividade é automática e dispensa controles.","E","A não cumulatividade depende de regras de apropriação e documentação. Controles fiscais são necessários para verificar a operação, a titularidade do crédito e o cumprimento dos requisitos legais."],["Reforma Tributária","A tributação no destino exige regras para identificar o local relevante da operação, que pode variar conforme o tipo de fornecimento.","C","Bens, serviços, operações presenciais e operações digitais podem exigir critérios específicos de localização. Sem regras claras, haveria conflito de competência e incerteza sobre o destino."],["Reforma Tributária","Regimes específicos podem considerar características de setores em que a aplicação do modelo geral exige adaptações, conforme autorização normativa.","C","Regime específico não significa ausência de tributação nem liberdade para criar exceções fora da lei. A reforma prevê tratamentos setoriais com regras próprias, dentro dos limites constitucionais."],["Reforma Tributária","A reforma constitucional, por si só, dispensa lei complementar para detalhar administração, créditos, regimes e transição dos novos tributos.","E","A emenda fornece a moldura constitucional, mas muitos elementos dependem de lei complementar e regulamentação. A banca explora a diferença entre criação constitucional e disciplina operacional."],["Reforma Tributária","A simplificação do sistema é um objetivo da reforma, mas não implica que todos os contribuintes terão redução automática da carga tributária individual.","C","Mudanças de base, alíquota, créditos e regimes podem produzir efeitos diferentes por setor e contribuinte. Simplificação e neutralidade do sistema não equivalem a redução universal da carga."],["Auditoria Fiscal","A evidência de auditoria deve ser suficiente e apropriada; suficiência se relaciona à quantidade e adequação, à qualidade e relevância.","C","Mais evidência fraca não compensa necessariamente sua baixa qualidade. Evidência externa independente costuma ser mais confiável que declaração interna isolada, embora o contexto importe."],["Auditoria Fiscal","A confirmação externa obtida diretamente de terceiro independente tende a ser mais confiável do que informação verbal fornecida apenas pelo auditado.","C","A origem independente e o controle do auditor sobre o envio e recebimento fortalecem a confiabilidade. Ainda assim, a confirmação precisa ser avaliada quanto à autenticidade, resposta e limitações."],["Auditoria Fiscal","A amostragem estatística elimina o risco de amostragem e garante que a conclusão seja idêntica à obtida com exame integral.","E","Toda amostra envolve risco de que a conclusão difira da população. Métodos estatísticos quantificam e controlam o risco, mas não o eliminam; também existem riscos não amostrais, como erro de execução."],["Auditoria Fiscal","A materialidade depende apenas do valor monetário absoluto da distorção, sem considerar natureza ou circunstâncias.","E","A materialidade pode ser quantitativa e qualitativa. Uma irregularidade pequena pode ser relevante por envolver fraude, descumprimento legal, conflito de interesse ou mudança de tendência."],["Auditoria Fiscal","O risco de detecção é o risco de que procedimentos do auditor não identifiquem distorção relevante existente.","C","Esse risco está ligado à eficácia dos procedimentos de auditoria. O auditor ajusta natureza, época e extensão dos testes para reduzir o risco de auditoria a nível aceitavelmente baixo."],["Auditoria Fiscal","A segregação de funções reduz a possibilidade de uma mesma pessoa controlar todas as etapas críticas de uma transação.","C","Separar autorização, custódia, registro e conciliação cria controles cruzados. A medida reduz risco, mas não o elimina se houver conluio ou falhas de supervisão."],["Auditoria Fiscal","A conciliação entre registros contábeis e fontes independentes pode revelar diferenças, omissões ou lançamentos indevidos.","C","Conciliações com extratos, documentos fiscais e bases externas são procedimentos de controle e auditoria. Diferenças precisam ser investigadas, não apenas ajustadas sem evidência."],["Auditoria Fiscal","A existência de controle interno formal permite ao auditor dispensar testes substantivos em qualquer área examinada.","E","A avaliação dos controles pode alterar a natureza e extensão dos testes, mas não autoriza dispensa automática em todos os casos. O auditor precisa obter evidência suficiente e responder aos riscos identificados."],["Auditoria Fiscal","Procedimentos analíticos podem comparar relações esperadas entre dados financeiros e não financeiros para identificar variações incomuns.","C","Margens, volumes, preços e tendências podem indicar áreas de risco. Uma variação incomum é indício a investigar, não prova isolada de fraude ou erro."],["Auditoria Fiscal","A documentação de auditoria deve permitir que auditor experiente, sem envolvimento prévio, compreenda os procedimentos, evidências e conclusões relevantes.","C","Papéis de trabalho demonstram fundamento da opinião e permitem revisão e supervisão. Devem registrar julgamentos importantes e conclusões, respeitados requisitos de confidencialidade e guarda."],["Auditoria Fiscal","A auditoria baseada em risco concentra esforços nas áreas com maior probabilidade e impacto de distorção relevante.","C","A avaliação de risco orienta planejamento e alocação de recursos. Não significa ignorar áreas de menor risco nem aceitar automaticamente as informações da administração."],["Auditoria Fiscal","A detecção de fraude é responsabilidade exclusiva da administração, cabendo ao auditor apenas verificar cálculos aritméticos.","E","A administração tem responsabilidade primária por prevenção e detecção, mas o auditor também deve obter segurança razoável de que as demonstrações não contêm distorção relevante por fraude ou erro e responder aos riscos."],["Auditoria Fiscal","O lançamento tributário de ofício pode ser revisto nas hipóteses e dentro dos limites previstos no CTN, inclusive diante de erro ou omissão legalmente relevante.","C","A revisão não é ilimitada nem livre de prazos. O CTN disciplina hipóteses de revisão e proteção à estabilidade do crédito; a autoridade deve fundamentar a alteração conforme a lei."],["Auditoria Fiscal","A circularização negativa exige que o destinatário responda obrigatoriamente em todos os casos, inclusive quando concorda com a informação.","E","Na confirmação negativa, normalmente se solicita resposta quando há discordância. A ausência de resposta não oferece o mesmo grau de evidência que uma confirmação positiva, e a adequação do método depende do risco."],["Auditoria Fiscal","Um achado de auditoria bem fundamentado relaciona critério, condição observada, causa e efeito ou risco, apoiado por evidência.","C","Essa estrutura ajuda a explicar o desvio: o critério é o padrão esperado, a condição é o fato, a causa explica por que ocorreu e o efeito descreve consequência ou risco. A recomendação deve responder à causa identificada."],["Ciência de Dados","Uma chave primária identifica univocamente cada registro e não admite valor nulo em uma tabela relacional.","C","A chave primária assegura identificação única e integridade de entidade. Uma tabela pode ter chave composta, formada por mais de uma coluna, desde que a combinação seja única e não nula."],["Ciência de Dados","Em um processo ETL, a transformação ocorre antes da extração dos dados da origem.","E","ETL significa extrair, transformar e carregar. Em ELT, por outro lado, os dados são carregados antes de parte das transformações no destino; a ordem das etapas é o ponto central."],["Ciência de Dados","A deduplicação de registros exige definir critérios de equivalência, pois nomes semelhantes não provam que duas linhas representam a mesma entidade.","C","A resolução de entidades pode combinar identificadores, regras e similaridade. Uma deduplicação agressiva gera falsos positivos e pode unir pessoas ou empresas distintas."],["Ciência de Dados","Valores ausentes devem sempre ser substituídos por zero, independentemente do significado da variável.","E","Zero pode ser um valor real e sua imputação distorce distribuições. A estratégia depende do mecanismo de ausência, do tipo de variável e da finalidade analítica; exclusão, imputação ou indicador de ausência podem ser apropriados."],["Ciência de Dados","A análise exploratória de dados pode identificar valores extremos, assimetrias e inconsistências antes da modelagem.","C","Estatísticas descritivas e visualizações ajudam a compreender qualidade e estrutura dos dados. Valores extremos devem ser investigados, não removidos automaticamente, pois podem representar eventos legítimos."],["Ciência de Dados","A mediana costuma ser uma medida de tendência central robusta a valores extremos.","C","A posição central depende da ordenação e é menos afetada por magnitudes muito altas ou baixas. A média pode ser mais informativa em certas distribuições, mas é sensível a extremos."],["Ciência de Dados","Uma correlação elevada entre duas variáveis demonstra que uma delas causa a outra.","E","Correlação mede associação, não causalidade. Confundimento, causalidade reversa e coincidência podem explicar a relação; inferência causal exige desenho e pressupostos adicionais."],["Ciência de Dados","Em regressão linear, resíduos devem ser examinados para avaliar pressupostos e identificar padrões não capturados pelo modelo.","C","Padrões nos resíduos podem indicar não linearidade, heterocedasticidade, observações influentes ou especificação inadequada. A inspeção não é garantia de validade, mas é etapa diagnóstica importante."],["Ciência de Dados","A multicolinearidade perfeita entre variáveis explicativas pode impedir a estimação única de todos os coeficientes por mínimos quadrados ordinários.","C","Com dependência linear exata entre colunas, a matriz necessária à estimação não tem posto completo e os coeficientes não são identificáveis de forma única. Colinearidade alta, mas não perfeita, tende a aumentar a incerteza."],["Ciência de Dados","Em classificação, a curva ROC relaciona taxa de verdadeiros positivos e taxa de falsos positivos para diferentes limiares.","C","A ROC representa sensibilidade contra 1−especificidade. A área sob a curva resume capacidade de ordenação, mas não substitui avaliação de calibração ou métricas adequadas ao custo do erro."],["Ciência de Dados","A métrica F1 é a média aritmética simples entre precisão e recall.","E","F1 é a média harmônica: 2·(precisão·recall)/(precisão+recall). Ela penaliza situações em que uma das duas métricas é muito baixa."],["Ciência de Dados","A validação cruzada k-fold divide os dados em k partes e alterna a parte de validação entre as rodadas.","C","Cada rodada treina em k−1 partes e valida na restante. A estratégia estima estabilidade, mas dados temporais ou agrupados exigem divisões que respeitem a estrutura para evitar vazamento."],["Ciência de Dados","Em séries temporais, uma divisão aleatória de observações pode permitir que dados futuros influenciem a avaliação de previsões passadas.","C","A avaliação deve respeitar a ordem temporal, treinando no passado e testando no futuro. Uma divisão aleatória pode produzir estimativa artificialmente otimista quando há tendência ou autocorrelação."],["Ciência de Dados","Uma tabela fato em modelo dimensional costuma registrar eventos ou medidas de negócio e relacionar-se a dimensões descritivas.","C","Fatos guardam medidas e chaves dimensionais; dimensões descrevem contexto como tempo, produto ou região. A granularidade da tabela fato precisa ser definida explicitamente."],["Ciência de Dados","Em um data lake, a presença de dados brutos dispensa catálogo, metadados e controles de qualidade.","E","Armazenar dados brutos não elimina a necessidade de governança. Sem catálogo, linhagem, permissões e qualidade, o lake pode virar um repositório difícil de localizar e confiar."],["Ciência de Dados","O processamento em lote é apropriado para grandes volumes quando a latência imediata não é requisito central.","C","Batch processa conjuntos de dados em intervalos ou janelas. Streaming atende cenários que exigem tratamento contínuo e baixa latência; os modelos podem coexistir na mesma arquitetura."],["Ciência de Dados","A linhagem de dados permite rastrear origem, transformações e destinos dos dados ao longo do pipeline.","C","Data lineage ajuda auditoria, impacto de mudanças e investigação de discrepâncias. É especialmente relevante em ambientes regulados e para reproduzir indicadores publicados."],["Ciência de Dados","Um dashboard com atualização em tempo real é necessariamente mais útil do que um relatório periódico para toda decisão gerencial.","E","A utilidade depende da decisão e do custo da atualização. Para indicadores estáveis ou decisões estratégicas, relatórios periódicos podem ser suficientes e reduzir ruído operacional."],["Ciência de Dados","Privacidade por desenho recomenda considerar proteção de dados desde a concepção do sistema, e não apenas após o lançamento.","C","Controles, minimização, retenção e acesso devem ser planejados desde o início. Adicionar privacidade ao final pode exigir redesenho e não corrigir dados coletados sem necessidade."],["Ciência de Dados","O balanceamento de classes deve ser feito antes da separação entre treino e teste, para que os conjuntos tenham a mesma distribuição artificial.","E","A separação deve ocorrer antes de técnicas de reamostragem, aplicadas apenas ao treino. Balancear o conjunto inteiro pode vazar informação e distorcer a avaliação em uma prevalência mais próxima da realidade."]];
var qs3=raw3.map(function(x,i){return {id:i+1,subject:x[0],text:x[1],answer:x[2],comment:x[3]};});
var currentBank=qs,currentKey="nair_answers_1";
var expected={"Matemática Financeira":5,"Direito Constitucional":5,"Direito Administrativo":5,"Contabilidade Geral":5,"Direito Tributário":10,"Estatística e Probabilidade":10,"Contabilidade Pública":10,"Economia":10,"Finanças Públicas":10,"Legislação Tributária Estadual":10,"Inteligência Artificial":10,"Desenvolvimento de Sistemas":10,"Infraestrutura de TIC e Segurança":10,"Reforma Tributária":15,"Auditoria Fiscal":15,"Ciência de Dados":20};
var answers={};try{answers=JSON.parse(localStorage.getItem(currentKey)||"{}")}catch(e){answers={}};
var seconds=16200,started=false,paused=true,finished=false;
var timer=document.getElementById("timer"),quiz=document.getElementById("quiz"),startBox=document.getElementById("startBox"),finishBox=document.getElementById("finishBox"),result=document.getElementById("result");
function clock(){var h=String(Math.floor(seconds/3600)).padStart(2,"0"),m=String(Math.floor(seconds%3600/60)).padStart(2,"0"),s=String(seconds%60).padStart(2,"0");timer.textContent=h+":"+m+":"+s}
function progress(){document.getElementById("bar").style.width=(Object.keys(answers).length/160*100)+"%"}
function render(){var frag=document.createDocumentFragment();currentBank.forEach(function(q){var c=document.createElement("article");c.className="card";var sm=document.createElement("div");sm.className="small";sm.textContent="Questão "+q.id+" · "+q.subject;var t=document.createElement("div");t.className="q";t.textContent=q.text;var row=document.createElement("div");["C","E","B"].forEach(function(v){var b=document.createElement("button");b.className="opt"+(answers[q.id]===v?" selected":"");b.textContent=v==="C"?"Certo":v==="E"?"Errado":"Em branco";b.addEventListener("click",function(){answers[q.id]=v;localStorage.setItem(currentKey,JSON.stringify(answers));Array.from(row.children).forEach(function(z){z.classList.remove("selected")});b.classList.add("selected");progress()});row.appendChild(b)});c.appendChild(sm);c.appendChild(t);c.appendChild(row);frag.appendChild(c)});quiz.innerHTML="";quiz.appendChild(frag);progress()}
document.getElementById("startBtn").addEventListener("click",function(){if(started)return;currentBank=qs;currentKey="nair_answers_1";try{answers=JSON.parse(localStorage.getItem(currentKey)||"{}")}catch(e){answers={}};document.getElementById("selectedInfo").textContent="1º Simulado selecionado.";started=true;paused=false;startBox.classList.add("hidden");quiz.classList.remove("hidden");finishBox.classList.remove("hidden");render()});
document.getElementById("startBtn2").addEventListener("click",function(){if(started)return;currentBank=qs2;currentKey="nair_answers_2";try{answers=JSON.parse(localStorage.getItem(currentKey)||"{}")}catch(e){answers={}};document.getElementById("selectedInfo").textContent="2º Simulado selecionado.";started=true;paused=false;startBox.classList.add("hidden");quiz.classList.remove("hidden");finishBox.classList.remove("hidden");render()});
document.getElementById("startBtn3").addEventListener("click",function(){if(started)return;currentBank=qs3;currentKey="nair_answers_3";try{answers=JSON.parse(localStorage.getItem(currentKey)||"{}")}catch(e){answers={}};document.getElementById("selectedInfo").textContent="3º Simulado selecionado.";started=true;paused=false;startBox.classList.add("hidden");quiz.classList.remove("hidden");finishBox.classList.remove("hidden");render()});
document.getElementById("pauseBtn").addEventListener("click",function(){if(!started||finished)return;paused=!paused;this.textContent=paused?"Retomar":"Pausar"});
function finish(){if(finished)return;finished=true;paused=true;var ac=0,er=0,bl=0,bySubject={};currentBank.forEach(function(q){var v=answers[q.id]||"B";if(!bySubject[q.subject])bySubject[q.subject]={total:0,ac:0,er:0,bl:0};var s=bySubject[q.subject];s.total++;if(v==="B"){bl++;s.bl++}else if(v===q.answer){ac++;s.ac++}else{er++;s.er++}});var rows=Object.keys(bySubject).map(function(name){var s=bySubject[name],attempted=s.ac+s.er;s.net=s.ac-s.er;s.pct=attempted?Math.round(s.ac/attempted*100):0;s.attempted=attempted;return {name:name,s:s}}).sort(function(x,y){if(x.s.pct!==y.s.pct)return x.s.pct-y.s.pct;return y.s.bl-x.s.bl});var html="<div class='card result'><h2>Resultado geral</h2><h1>"+(ac-er)+" pontos líquidos</h1><p><b>Acertos:</b> "+ac+" · <b>Erros:</b> "+er+" · <b>Em branco:</b> "+bl+"</p><h3>Desempenho por disciplina</h3><p class='small'>O percentual de acertos é calculado sobre as questões respondidas (acertos ÷ acertos + erros). Questões em branco aparecem separadamente. A tabela está ordenada da menor para a maior taxa de acerto, para ajudar a definir prioridades de revisão.</p><div style='overflow-x:auto'><table style='width:100%;border-collapse:collapse;font-size:14px'><thead><tr><th style='text-align:left;padding:8px;border-bottom:2px solid #ddd'>Disciplina</th><th style='padding:8px;border-bottom:2px solid #ddd'>Acertos</th><th style='padding:8px;border-bottom:2px solid #ddd'>Erros</th><th style='padding:8px;border-bottom:2px solid #ddd'>Em branco</th><th style='padding:8px;border-bottom:2px solid #ddd'>Líquidos</th><th style='padding:8px;border-bottom:2px solid #ddd'>% acerto</th></tr></thead><tbody>";rows.forEach(function(x){var s=x.s;html+="<tr><td style='padding:8px;border-bottom:1px solid #ddd'>"+x.name+"</td><td style='text-align:center;padding:8px;border-bottom:1px solid #ddd'>"+s.ac+"</td><td style='text-align:center;padding:8px;border-bottom:1px solid #ddd'>"+s.er+"</td><td style='text-align:center;padding:8px;border-bottom:1px solid #ddd'>"+s.bl+"</td><td style='text-align:center;padding:8px;border-bottom:1px solid #ddd'>"+s.net+"</td><td style='text-align:center;padding:8px;border-bottom:1px solid #ddd'>"+(s.attempted?s.pct+"%":"—")+"</td></tr>"});html+="</tbody></table></div><h3>Prioridades para revisão</h3><ol>";var priorities=rows.filter(function(x){return x.s.er>0||x.s.bl>0}).slice(0,5);if(priorities.length){priorities.forEach(function(x){var s=x.s;html+="<li style='margin-bottom:8px'><b>"+x.name+"</b>: "+(s.attempted?s.pct+"% de acerto nas respondidas":"nenhuma respondida")+"; "+s.er+" erro(s), "+s.bl+" em branco. <span class='small'>Revisar primeiro os assuntos dos erros e avaliar se as questões em branco poderiam ser resolvidas com segurança.</span></li>"})}else{html+="<li>Não há erros nem questões em branco neste simulado.</li>"}html+="</ol><h3>Gabarito comentado</h3>";currentBank.forEach(function(q){var v=answers[q.id]||"B";html+="<div style='border-top:1px solid #ddd;padding:10px 0'><b>"+q.id+". "+q.subject+"</b> — Gabarito: "+(q.answer==="C"?"Certo":"Errado")+" · Sua resposta: "+(v==="C"?"Certo":v==="E"?"Errado":"Em branco")+"<br><span class='small'>"+q.comment+"</span></div>"});html+="</div>";result.innerHTML=html;result.classList.remove("hidden");finishBox.classList.add("hidden");window.scrollTo(0,0)}
document.getElementById("finishBtn").addEventListener("click",function(){if(confirm("Entregar o simulado agora?"))finish()});
setInterval(function(){if(!started||paused||finished)return;if(seconds>0){seconds--;clock()}else finish()},1000);clock();
})();
</script></body></html>
