var raw=[["Matemática Financeira","Um título de valor nominal de R$ 100.000 sofre desconto racional composto à taxa efetiva de 2% ao mês, três meses antes do vencimento. Considerando mês comercial para a capitalização, o valor atual é inferior a R$ 94.300.","C","Pelo desconto racional composto, VA=100000/(1,02)^3, aproximadamente R$ 94.232."],["Matemática Financeira","Uma taxa nominal de 24% ao ano, capitalizada mensalmente, corresponde a uma taxa efetiva anual superior a 24%.","C","A taxa efetiva é (1+0,24/12)^12-1, superior à nominal anual."],["Matemática Financeira","No sistema SAC, mantidas constantes a taxa e a periodicidade, as prestações são decrescentes porque a amortização é constante e os juros incidem sobre saldo devedor progressivamente menor.","C","No SAC a amortização é fixa; como os juros caem, a prestação total diminui."],["Matemática Financeira","Em uma série uniforme postecipada, a primeira prestação ocorre no início do período de referência e, portanto, não há incidência de juros entre a data focal e essa prestação.","E","Série postecipada tem pagamentos ao fim de cada período; pagamento inicial caracteriza série antecipada."],["Matemática Financeira","Se duas taxas efetivas são equivalentes para períodos distintos, então, para qualquer capital e horizonte comum, produzem o mesmo montante, desde que a conversão respeite a mesma convenção de capitalização.","C","Essa é a definição operacional de taxas equivalentes."],["Direito Constitucional","A competência para instituir impostos residuais pertence à União e somente pode ser exercida mediante lei complementar, desde que os novos impostos sejam não cumulativos e não tenham fato gerador ou base de cálculo próprios dos discriminados na Constituição.","C","CF, art. 154, I, reúne esses requisitos."],["Direito Constitucional","A imunidade recíproca impede que a União, os estados, o Distrito Federal e os municípios instituam impostos sobre patrimônio, renda ou serviços uns dos outros, alcançando automaticamente empresas públicas e sociedades de economia mista exploradoras de atividade econômica.","E","A extensão a entidades depende dos requisitos constitucionais; não alcança automaticamente empresas estatais exploradoras de atividade econômica."],["Direito Constitucional","A administração tributária é atividade essencial ao funcionamento do Estado e deve receber recursos prioritários para a realização de suas atividades, nos termos constitucionais.","C","A Constituição qualifica as administrações tributárias como atividades essenciais e prevê prioridade de recursos."],["Direito Constitucional","A criação de autarquia federal pode ocorrer por decreto do chefe do Poder Executivo, desde que exista autorização genérica em lei orçamentária.","E","Autarquia somente pode ser criada diretamente por lei específica."],["Direito Constitucional","A lei complementar pode estabelecer normas gerais em matéria de legislação tributária, especialmente sobre obrigação, lançamento, crédito, prescrição e decadência tributários.","C","É competência constitucional atribuída à lei complementar no art. 146."],["Direito Administrativo","A anulação de ato administrativo ilegal produz, em regra, efeitos retroativos, enquanto a revogação incide sobre ato válido por razões de conveniência e oportunidade.","C","É a distinção clássica entre invalidação e revogação."],["Direito Administrativo","A administração pode revogar ato administrativo vinculado sempre que entender que a medida deixou de ser conveniente, pois a vinculação limita apenas a competência e não o mérito.","E","Ato vinculado não contém margem de mérito para revogação por conveniência e oportunidade."],["Direito Administrativo","Na responsabilidade civil objetiva do Estado, a comprovação do dano e do nexo causal é suficiente, em regra, para o dever de indenizar, sem necessidade de demonstrar culpa do agente público.","C","Aplica-se, em regra, a responsabilidade objetiva estatal pelo art. 37, §6º, da CF."],["Direito Administrativo","O poder de polícia administrativa pode ser exercido exclusivamente de forma repressiva, pois medidas preventivas configurariam atividade jurisdicional.","E","O poder de polícia pode ter caráter preventivo e repressivo."],["Direito Administrativo","A inexigibilidade de licitação pressupõe inviabilidade de competição, ao passo que a dispensa ocorre nas hipóteses legais em que a competição é possível, mas a lei autoriza a contratação direta.","C","Essa é a distinção estrutural entre inexigibilidade e dispensa na Lei 14.133/2021."],["Contabilidade Geral","A aquisição de máquina à vista, sem incidência de tributos recuperáveis, provoca aumento do ativo imobilizado e redução de disponibilidades, sem alterar imediatamente o patrimônio líquido.","C","É permuta entre elementos do ativo."],["Contabilidade Geral","A depreciação acumulada é conta patrimonial retificadora do ativo e reduz o valor contábil do imobilizado sem representar, por si só, saída de caixa no período.","C","A depreciação é despesa sem desembolso corrente e retifica o ativo."],["Contabilidade Geral","O reconhecimento de receita pelo regime de competência depende necessariamente do recebimento do respectivo numerário no mesmo período.","E","Competência independe do recebimento; receita pode ser reconhecida antes ou depois do caixa."],["Contabilidade Geral","O custo de aquisição dos estoques inclui tributos recuperáveis, pois estes integram o sacrifício econômico necessário à colocação da mercadoria em condição de venda.","E","Tributos recuperáveis não compõem o custo do estoque."],["Contabilidade Geral","Uma provisão somente deve ser reconhecida quando houver obrigação presente decorrente de evento passado, saída provável de recursos e estimativa confiável do valor.","C","São requisitos centrais do reconhecimento de provisões."],["Direito Tributário","A obrigação tributária principal surge com a ocorrência do fato gerador e tem por objeto o pagamento de tributo ou penalidade pecuniária.","C","CTN, art. 113, o tributário não vencido, em cobrança executiva com penhora efetivada ou cuja exigibilidade esteja suspensa.","C","Hipóteses previstas no CTN para CPEN."],["Estatística e Probabilidade","Se duas variáveis aleatórias têm covariância nula, então elas são necessariamente independentes, qualquer que seja sua distribuição conjunta.","E","Independência implica covariância nula em condições usuais, mas a recíproca não vale em geral."],["Estatística e Probabilidade","A média aritmética é mais sensível a valores extremos que a mediana, razão pela qual distribuições assimétricas podem apresentar diferença relevante entre essas medidas.","C","Valores extremos afetam diretamente a média."],["Estatística e Probabilidade","Em uma distribuição normal, aproximadamente 95% das observações encontram-se a até dois desvios-padrão da média.","C","Pela regra empírica, aproximadamente 95% ficam entre μ−2σ e μ+2σ."],["Estatística e Probabilidade","A variância amostral calculada com divisor n é sempre um estimador não viesado da variância populacional.","E","O estimador usualmente não viesado utiliza n−1 sob amostragem aleatória."],["Estatística e Probabilidade","O erro-padrão da média diminui à medida que o tamanho da amostra aumenta, mantendo-se a variabilidade populacional constante.","C","SE( média ) = σ/√n, sob condições usuais."],["Estatística e Probabilidade","Em amostragem estratificada, a população é dividida em grupos internamente semelhantes quanto à característica de interesse, e unidades são selecionadas dentro de cada estrato.","C","Essa é a lógica da estratificação."],["Estatística e Probabilidade","Na amostragem por conglomerados, cada conglomerado deve necessariamente ser homogêneo internamente e heterogêneo entre si para que o estimador seja válido.","E","A lógica usual é buscar conglomerados que reproduzam, tanto quanto possível, a heterogeneidade populacional."],["Estatística e Probabilidade","Se P(A)>0 e P(B)>0, a igualdade P(A∩B)=P(A)P(B) caracteriza independência entre A e B.","C","É a condição de independência para eventos."],["Estatística e Probabilidade","Um intervalo de confiança de 95% significa que, para um intervalo já calculado, há exatamente 95% de probabilidade de o parâmetro populacional estar dentro dele.","E","Na interpretação frequentista, 95% é propriedade do procedimento em repetições, não probabilidade posterior do parâmetro fixo."],["Estatística e Probabilidade","A correlação linear de Pearson igual a zero demonstra ausência de qualquer relação entre duas variáveis.","E","Pode existir relação não linear mesmo com correlação linear zero."],["Contabilidade Pública","No setor público, o reconhecimento de uma variação patrimonial aumentativa pode ocorrer independentemente do ingresso de caixa, em observância ao regime patrimonial.","C","VPA é reconhecida patrimonialmente sem depender do fluxo financeiro."],["Contabilidade Pública","A receita orçamentária pertence exclusivamente ao enfoque patrimonial, razão pela qual seu reconhecimento ocorre somente quando houver alteração positiva do patrimônio líquido.","E","Receita orçamentária e VPA são conceitos distintos."],["Contabilidade Pública","O empenho é o ato emanado de autoridade competente que cria para o Estado obrigação de pagamento pendente ou não de implemento de condição.","C","Conceito da Lei 4.320/1964."],["Contabilidade Pública","É vedada a realização de despesa sem prévio empenho, embora a legislação admita, em situações específicas, dispensa da emissão da nota de empenho.","C","A regra é prévio empenho; a nota pode ter dispensa em hipóteses regulamentares."],["Contabilidade Pública","A liquidação da despesa consiste exclusivamente na verificação da disponibilidade financeira para pagamento.","E","Liquidação verifica direito adquirido pelo credor, origem, objeto, importância e credor."],["Contabilidade Pública","O pagamento da despesa pública somente pode ser efetuado após sua regular liquidação.","C","Regra da Lei 4.320/1964."],["Contabilidade Pública","Restos a pagar processados correspondem a despesas empenhadas e não pagas, já liquidadas até 31 de dezembro.","C","Essa é a caracterização dos processados."],["Contabilidade Pública","A dívida flutuante compreende, entre outros, restos a pagar, serviços da dívida a pagar e depósitos, não abrangendo operações de crédito de longo prazo.","C","Esses elementos integram a dívida flutuante."],["Contabilidade Pública","O superávit financeiro apurado no balanço patrimonial corresponde à diferença positiva entre ativo financeiro e passivo financeiro, conjugada com os saldos dos créditos adicionais transferidos e operações vinculadas.","C","A definição legal considera esses componentes."],["Contabilidade Pública","O princípio orçamentário da universalidade permite excluir do orçamento receitas de autarquias e fundos quando suas despesas forem financiadas por recursos próprios.","E","A universalidade exige que todas as receitas e despesas sejam abrangidas pelo orçamento, ressalvadas hipóteses legais."],["Economia","Em concorrência perfeita, uma firma individual é tomadora de preços e enfrenta curva de demanda horizontal ao preço de mercado.","C","A firma não consegue influenciar o preço."],["Economia","Um monopolista que maximiza lucro escolhe quantidade em que receita marginal se iguala ao custo marginal, desde que a solução seja interior.","C","Condição de primeira ordem da maximização."],["Economia","A elasticidade-preço da demanda mede a variação absoluta da quantidade demandada provocada por uma unidade monetária de variação no preço.","E","Elasticidade é uma razão percentual, não variação absoluta por unidade."],["Economia","Um aumento da taxa de juros, ceteris paribus, tende a reduzir o investimento agregado quando este é sensível ao custo de financiamento.","C","É um canal tradicional da política monetária."],["Economia","Na identidade da renda nacional em economia fechada sem governo, poupança privada é necessariamente igual ao investimento planejado em qualquer instante.","E","A igualdade ex post pode existir, mas investimento planejado e poupança podem divergir no curto prazo."],["Economia","Uma política fiscal expansionista, mantidas as demais condições, tende a elevar a demanda agregada e pode pressionar a taxa de juros em uma economia com restrições monetárias.","C","É o efeito usual em modelos macroeconômicos."],["Economia","Inflação de demanda ocorre quando a capacidade produtiva ociosa aumenta e a demanda agregada diminui de forma persistente.","E","É associada a pressão de demanda sobre capacidade produtiva."],["Economia","A curva de Phillips de curto prazo pode representar relação inversa entre inflação e desemprego, mas essa relação não implica um trade-off permanente no longo prazo.","C","A formulação moderna distingue curto e longo prazo."],["Economia","Depreciação cambial significa necessariamente valorização da moeda doméstica perante moedas estrangeiras.","E","Depreciação é perda de valor da moeda doméstica."],["Economia","Externalidades negativas podem justificar intervenção estatal porque decisões privadas podem impor custos a terceiros não incorporados ao preço de mercado.","C","É fundamento econômico para políticas corretivas."],["Finanças Públicas","A regra de ouro impede, em termos constitucionais, que o montante das operações de crédito supere o das despesas de capital, ressalvadas as hipóteses autorizadas pelo Poder Legislativo por maioria absoluta.","C","É a regra do art. 167, III, da CF."],["Finanças Públicas","A LRF considera despesa obrigatória de caráter continuado aquela derivada de lei, medida provisória ou ato administrativo normativo que fixe obrigação legal de execução por período superior a dois exercícios.","C","Conceito do art. 17 da LRF."],["Finanças Públicas","A renúncia de receita compreende apenas anistia e remissão, não abrangendo subsídios, créditos presumidos, isenções ou benefícios que impliquem redução discriminada de tributos.","E","A LRF enumera também subsídios, crédito presumido, tária Estadual","Segundo a legislação alagoana do ICMS, a entrada interestadual de mercadoria destinada ao uso, consumo ou ativo imobilizado de contribuinte pode constituir fato gerador do imposto.","C","A legislação estadual contempla essa hipótese."],["Legislação Tributária Estadual","Convenção particular entre vendedor e comprador pode alterar, perante a Fazenda Pública, a definição legal do sujeito passivo do ICMS.","E","Convenções particulares não podem ser opostas para modificar a definição legal do sujeito passivo."],["Legislação Tributária Estadual","O PAT alagoano pode abranger processos relativos a lançamento de crédito tributário, consulta, restituição de indébito, reconhecimento de benefício fiscal e outros procedimentos previstos em lei.","C","A própria SEFAZ/AL informa essas matérias no âmbito do PAT."],["Legislação Tributária Estadual","No PAT contencioso alagoano, o processo decorrente de auto de infração instaura-se, segundo a orientação oficial da SEFAZ/AL, com a apresentação da defesa que impugna o lançamento.","C","É a regra indicada pela SEFAZ/AL com base no art. 21 da Lei 6.771/2006."],["Legislação Tributária Estadual","Os prazos processuais do PAT alagoano são contados incluindo-se o dia inicial e excluindo-se o dia do vencimento.","E","A regra informada pela SEFAZ/AL é excluir o início e incluir o vencimento."],["Legislação Tributária Estadual","O IPVA em Alagoas incide sobre a propriedade de veículo automotor sujeito a registro, matrícula ou licenciamento no estado, conforme a Lei 6.555/2004.","C","É a regra de incidência prevista na lei."],["Legislação Tributária Estadual","Para fins da Lei 6.555/2004, veículo automotor restringe-se aos veículos terrestres, não abrangendo veículos aéreos, aquáticos ou anfíbios.","E","A definição legal alcança veículos aéreos, terrestres, aquáticos e anfíbios dotados de força motriz própria."],["Legislação Tributária Estadual","O ITCD alagoano alcança transmissões causa mortis e doações de quaisquer bens ou direitos, nos termos da legislação estadual.","C","É o núcleo material do imposto previsto na Lei 5.077/1989."],["Legislação Tributária Estadual","A Lei alagoana do Programa Contribuinte Arretado integra o conteúdo de legislação tributária estadual indicado para o concurso e disciplina mecanismos de estímulo à relação Fisco-contribuinte.","C","A Lei 8.085/2018 está expressamente indicada no edital."],["Inteligência Artificial","Em aprendizado supervisionado, o conjunto de treinamento contém, em regra, observações para as quais a variável-alvo é conhecida.","C","A presença do rótulo distingue o aprendizado supervisionado."],["Inteligência Artificial","Em aprendizado não supervisionado, a ausência de variável-alvo conhecida impede qualquer tarefa de agrupamento ou redução de dimensionalidade.","E","Clusterização e PCA são exemplos de tarefas não supervisionadas."],["Inteligência Artificial","Em um sistema RAG, a recuperação de documentos relevantes pode ser realizada antes da geração para fornecer contexto externo ao modelo de linguagem.","C","Retrieval-Augmented Generation combina recuperação e geração."],["Inteligência Artificial","Aumentar indefinidamente a temperatura de amostragem de um modelo de linguagem torna suas respostas necessariamente mais factuais e menos aleatórias.","E","Temperatura maior tende a aumentar diversidade/aleatoriedade."],["Inteligência Artificial","Overfitting ocorre quando um modelo apresenta desempenho elevado nos dados de treinamento, mas degrada sua capacidade de generalização para dados não vistos.","C","É a definição de sobreajuste."],["Inteligência Artificial","Regularização L2 tende a penalizar pesos elevados, podendo reduzir complexidade do modelo e ajudar no controle do overfitting.","C","A penalização quadrática dos pesos é característica da L2."],["Inteligência Artificial","Em classificação binária altamente desbalanceada, acurácia elevada pode ocultar desempenho ruim na classe minoritária.","C","Acurácia pode ser enganosa em classes desbalanceadas."],["Inteligência Artificial","Um modelo generativo é necessariamente incapaz de produzir dados sintéticos semelhantes aos dados de treinamento.","E","Modelos generativos existem justamente para modelar e gerar amostras."],["Inteligência Artificial","Em redes neurais, a função de ativação introduz não linearidade; sem ela, a composição de múltiplas camadas lineares continua sendo uma transformação linear.","C","Composição de transformações lineares permanece linear."],["Inteligência Artificial","Explicabilidade e interpretabilidade são irrelevantes em sistemas de IA usados em fiscalização, porque a acurácia do modelo substitui a necessidade de justificar decisões.","E","Em aplicações de alto impacto, transparência e justificabilidade podem ser essenciais."],["Desenvolvimento de Sistemas","Em uma API REST, idempotência significa que repetir determinada requisição produz o mesmo efeito pretendido no servidor, embora a resposta possa variar em metadados.","C","PUT e DELETE são exemplos tradicionalmente associados à idempotência."],["Desenvolvimento de Sistemas","Toda requisição HTTP POST é idempotente por definição do protocolo.","E","POST não é, em geral, idempotente."],["Desenvolvimento de Sistemas","OAuth 2.0 é um protocolo de autorização e não deve ser confundido, por si só, com um protocolo de autenticação de identidade.","C","OpenID Connect adiciona camada de identidade sobre OAuth 2.0."],["Desenvolvimento de Sistemas","Um JWT assinado garante confidencialidade do conteúdo de seu payload, ainda que nenhum mecanismo de criptografia seja empregado.","E","Assinatura garante integridade/autenticidade; JWT não criptografado não garante confidencialidade."],["Desenvolvimento de Sistemas","Em arquitetura orientada a eventos, produtores e consumidores podem ser desacoplados temporalmente por meio de um broker ou mecanismo de mensageria.","C","Mensageria é mecanismo típico de desacoplamento."],["Desenvolvimento de Sistemas","O padrão CAP afirma que um sistema distribuído pode garantir simultaneamente consistência, disponibilidade e tolerância a partições em todos os cenários de partição.","E","Sob partição, o sistema deve escolher entre consistência e disponibilidade no sentido do teorema."],["Desenvolvimento de Sistemas","Testes de integração verificam a interação entre componentes, enquanto testes unitários se concentram em unidades isoladas de comportamento.","C","É a distinção básica entre os níveis."],["Desenvolvimento de Sistemas","Em controle de versão distribuído, cada clone Git contém histórico suficiente para várias operações locais sem depender continuamente do servidor remoto.","C","Essa é característica do Git distribuído."],["Desenvolvimento de Sistemas","O princípio de menor privilégio recomenda conceder a cada componente somente as permissões necessárias para cumprir sua função.","C","É princípio central de segurança."],["Desenvolvimento de Sistemas","Uma arquitetura de microsserviços elimina automaticamente problemas de consistência distribuída, transações e observabilidade porque cada serviço possui banco próprio.","E","Microsserviços introduzem ou ampliam desafios distribuídos."],["Infraestrutura de TIC e Segurança da Informação","Em uma infraestrutura com PKI, a autoridade certificadora emite certificados digitais vinculando identidades a chaves públicas conforme políticas de certificação.","C","Essa é a função central da CA."],["Infraestrutura de TIC e Segurança da Informação","Criptografia simétrica utiliza, em regra, chaves distintas para cifrar e decifrar, enquanto a assimétrica utiliza uma única chave secreta compartilhada.","E","É o inverso: simétrica usa chave compartilhada; assimétrica usa par de chaves."],["Infraestrutura de TIC e Segurança da Informação","Hash criptográfico é projetado para ser unidirecional e para dificultar a obtenção de entradas distintas que produzam a mesma saída.","C","Resistência à preimagem e colisão são propriedades desejáveis."],["Infraestrutura de TIC e Segurança da Informação","Um ataque de phishing depende necessariamente da exploração de vulnerabilidade de software sem interação do usuário.","E","Phishing frequentemente explora engenharia social e interação humana."],["Infraestrutura de TIC e Segurança da Informação","Autenticação multifator exige fatores de categorias distintas, como conhecimento e posse, e não apenas duas senhas diferentes.","C","Dois conhecimentos distintos continuam sendo um único fator de categoria."],["Infraestrutura de TIC e Segurança da Informação","Backup armazenado permanentemente conectado ao ambiente de produção é suficiente para proteger contra ransomware em qualquer cenário.","E","Backups conectados também podem ser criptografados ou destruídos pelo atacante."],["Infraestrutura de TIC e Segurança da Informação","Segmentação de rede pode reduzir o movimento lateral de um atacante ao limitar a comunicação entre segmentos e ativos.","C","É uma medida de contenção e arquitetura defensiva."],["Infraestrutura de TIC e Segurança da Informação","No modelo de responsabilidade compartilhada em nuvem, o provedor e o cliente possuem exatamente as mesmas responsabilidades de segurança em todos os modelos de serviço.","E","As responsabilidades variam conforme IaaS, PaaS, SaaS e contrato."],["Infraestrutura de TIC e Segurança da Informação","Disponibilidade é um dos objetivos clássicos da segurança da informação, ao lado de confidencialidade e integridade.","C","Tríade CIA."],["Infraestrutura de TIC e Segurança da Informação","Um certificado digital válido garante que todo conteúdo posteriormente assinado pelo titular seja verdadeiro e juridicamente correto, independentemente do contexto.","E","Certificado não garante veracidade material do conteúdo assinado."],["Reforma Tributária","A reforma tributária do consumo estruturou a substituição gradual de tributos sobre o consumo por IBS e CBS, com regras de transição previstas no novo sistema.","C","A EC 132/2023 e legislação complementar estruturam essa transição."],["Reforma Tributária","O IBS é tributo de competência exclusiva da União, enquanto a CBS é de competência compartilhada entre estados e municípios.","E","IBS é de competência de estados, Distrito Federal e municípios; CBS é federal."],["Reforma Tributária","A não cumulatividade do IBS busca impedir a incidência econômica em cascata, mediante apropriação de créditos conforme as regras do novo sistema.","C","A não cumulatividade é elemento estrutural do IBS."],["Reforma Tributária","A reforma mantém indefinidamente o ICMS como principal imposto estadual sobre consumo, sem período de transição ou redução de sua participação.","E","Há transição gradual do ICMS e outros tributos para o novo modelo."],["Reforma Tributária","O princípio do destino implica que a tributação do consumo seja orientada, em linhas gerais, pelo local de consumo, e não pela origem da produção.","C","É eixo central da reforma da tributação do consumo."],["Reforma Tributária","A existência de alíquota zero para determinada operação significa necessariamente inexistência de qualquer possibilidade de aproveitamento de crédito em toda e qualquer cadeia subsequente.","E","O tratamento dos créditos depende das regras específicas do novo sistema e da operação."],["Reforma Tributária","O mecanismo de split payment permite que, em determinadas operações, parcela do pagamento seja destinada diretamente à liquidação do tributo, reduzindo o risco de inadimplemento.","C","É uma das inovações de arrecadação assistida."],["Reforma Tributária","O Comitê Gestor do IBS substitui integralmente a autonomia política de estados e municípios, passando a exercer todas as competências legislativas desses entes.","E","O Comitê Gestor administra aspectos do IBS, sem substituir a autonomia política dos entes."],["Reforma Tributária","A cesta básica nacional pode receber tratamento favorecido no novo sistema, conforme definição e condições estabelecidas na legislação complementar.","C","A LC 214/2025 disciplina regimes favorecidos e a cesta básica."],["Reforma Tributária","O cashback previsto no novo modelo é mecanismo de devolução de parcela de tributos a determinados consumidores, segundo critérios legais, e não simples redução geral da alíquota.","C","Cashback é devolução direcionada, não redução geral."],["Reforma Tributária","A transição para o IBS e a CBS ocorre de forma instantânea em um único exercício, extinguindo simultaneamente todos os tributos substituídos.","E","A transição é gradual."],["Reforma Tributária","A apuração assistida pode utilizar informações eletrônicas disponíveis ao Fisco para facilitar a determinação dos débitos e créditos do contribuinte.","C","Integra o modelo de administração tributária orientado por dados."],["Reforma Tributária","O novo modelo de tributação do consumo torna irrelevantes os documentos fiscais eletrônicos, pois o crédito tributário passa a ser calculado exclusivamente por declarações anuais.","E","Documentos e informações eletrônicas permanecem fundamentais."],["Reforma Tributária","O IBS possui características de imposto não cumulativo e de tributação no destino, elementos destinados a reduzir distorções de origem e cumulatividade.","C","São características estruturantes do IBS."],["Reforma Tributária","A reforma tributária impede qualquer regime diferenciado de tributação, pois o objetivo constitucional é aplicar uma única alíquota efetiva a todas as operações sem exceção.","E","A legislação prevê regimes diferenciados, específicos e favorecidos."],["Auditoria Fiscal","No cruzamento de EFD ICMS/IPI com NF-e, divergências de quantidade ou valor entre documentos e escrituração podem constituir indícios de inconsistência que exigem análise adicional.","C","Cruzamentos são ferramentas para identificação de inconsistências, não prova automática de infração."],["Auditoria Fiscal","A existência de divergência entre NF-e e EFD comprova, por si só, omissão de receita e dispensa análise de cancelamentos, devoluções, ajustes e demais documentos relacionados.","E","Divergência é indício; precisa ser contextualizada."],["Auditoria Fiscal","O SPED permite integração e transmissão eletrônica de informações fiscais e contábeis, favorecendo cruzamentos automatizados pelo Fisco.","C","É uma das finalidades práticas do SPED."],["Auditoria Fiscal","O CFOP identifica a natureza da operação ou prestação para fins fiscais e, isoladamente, não determina todos os efeitos tributários da operação.","C","O CFOP é um código de classificação; outros elementos são necessários."],["Auditoria Fiscal","CST e CSOSN são códigos intercambiáveis e podem ser utilizados indistintamente por qualquer contribuinte, independentemente do regime tributário.","E","Cada código possui finalidade e contexto próprios."],["Auditoria Fiscal","A ausência de documento fiscal eletrônico em operação que deveria estar documentada pode constituir indício relevante de irregularidade, mas a conclusão fiscal depende da análise da legislação e dos fatos.","C","Auditoria exige correlação entre evidência e norma."],["Auditoria Fiscal","Em auditoria baseada em dados, uma anomalia estatística deve ser tratada como prova definitiva de fraude, pois métodos quantitativos eliminam a necessidade de exame documental.","E","Anomalia é sinal para investigação, não prova definitiva."],["Auditoria Fiscal","O MDF-e está relacionado à documentação eletrônica de transporte e pode ser utilizado em cruzamentos destinados a verificar coerência logística e fiscal.","C","É uma fonte de evidência para auditoria."],["Auditoria Fiscal","O CT-e documenta eletronicamente prestações de serviço de transporte e pode ser confrontado com NF-e, EFD e informações de circulação.","C","O cruzamento entre documentos é prática fiscal relevante."],["Auditoria Fiscal","Uma escrituração fiscal sem registro de documento de entrada necessariamente significa que a mercadoria jamais ingressou fisicamente no estabelecimento.","E","A ausência de registro não prova, sozinha, inexistência física da entrada."],["Auditoria Fiscal","A análise de margem bruta por produto pode auxiliar na identificação de padrões incompatíveis com a atividade declarada, mas não substitui a análise das operações concretas.","C","É ferramenta analítica, não prova isolada."],["Auditoria Fiscal","O cruzamento de vendas declaradas com recebimentos financeiros pode revelar inconsistências, mas diferenças podem decorrer de prazo de recebimento, antecipações, estornos ou outras causas legítimas.","C","A interpretação exige conciliação temporal e documental."],["Auditoria Fiscal","Em fiscalização, o fato de uma inconsistência ser encontrada por algoritmo elimina a necessidade de motivação do lançamento tributário.","E","O lançamento continua sujeito aos requisitos legais e à motivação pertinente."],["Auditoria Fiscal","A EFD pode conter informações úteis para reconstrução da cadeia de entradas e saídas e para comparação com documentos fiscais eletrônicos.","C","É uma das utilidades da escrituração digital."],["Auditoria Fiscal","A identificação de crédito de ICMS incompatível com a documentação de suporte pode indicar apropriação indevida, devendo o auditor verificar a origem, natureza e legitimidade do crédito antes de constituí-lo como irregularidade.","C","O crédito precisa ser confrontado com documentos e regras aplicáveis."],["Ciência de Dados","No processo CRISP-DM, a compreensão do negócio precede a modelagem e orienta a definição do problema analítico e dos critérios de sucesso.","C","Business understanding orienta todo o projeto."],["Ciência de Dados","Na etapa de preparação de dados do CRISP-DM, limpeza e transformação são irrelevantes porque modelos modernos corrigem automaticamente qualquer problema de qualidade.","E","Qualidade e preparação dos dados continuam essenciais."],["Ciência de Dados","Em banco relacional, uma chave primária identifica de forma única as linhas de uma tabela e não deve admitir valores nulos sob a regra usual de integridade de entidade.","C","É a função da chave primária."],["Ciência de Dados","Uma chave estrangeira é utilizada exclusivamente para ordenar fisicamente os registros da tabela referenciada.","E","Sua função é representar relacionamento e integridade referencial."],["Ciência de Dados","Um índice pode acelerar consultas seletivas, mas impõe custos de armazenamento e manutenção nas operações de inserção, atualização e exclusão.","C","Índices têm benefício de leitura e custo de escrita."],["Ciência de Dados","Em modelagem dimensional, a tabela fato normalmente concentra medidas e chaves para dimensões, enquanto tabelas dimensão armazenam atributos descritivos.","C","É a estrutura típica de um esquema estrela."],["Ciência de Dados","Normalização relacional busca reduzir redundância e anomalias de atualização, enquanto a desnormalização pode ser adotada deliberadamente para determinados objetivos analíticos.","C","São objetivos distintos de modelagem."],["Ciência de Dados","Em SQL, a cláusula WHERE filtra grupos depois da agregação realizada por GROUP BY, enquanto HAVING filtra linhas antes da agregação.","E","WHERE filtra linhas antes; HAVING filtra grupos após agregação."],["Ciência de Dados","Em um conjunto de dados com valores extremos, a mediana tende a ser mais robusta que a média para representar tendência central.","C","A mediana é menos sensível a outliers."],["Ciência de Dados","Imputar valores ausentes pela média sempre preserva a variância original da variável e não introduz qualquer viés.","E","Pode reduzir variância e introduzir distorções."],["Ciência de Dados","Em classificação, precisão mede a proporção de verdadeiros positivos entre os casos classificados como positivos.","C","Precisão = TP/(TP+FP)."],["Ciência de Dados","Recall mede a proporção de verdadeiros positivos entre todos os positivos reais.","C","Recall = TP/(TP+FN)."],["Ciência de Dados","Um modelo com 99% de acurácia é necessariamente superior a outro com 92% quando a classe positiva representa apenas 1% das observações.","E","Em forte desbalanceamento, acurácia isolada pode ser enganosa."],["Ciência de Dados","Na regressão linear, multicolinearidade elevada entre variáveis explicativas pode dificultar a interpretação e aumentar a instabilidade dos coeficientes estimados.","C","É um efeito conhecido da multicolinearidade."],["Ciência de Dados","Na clusterização, o algoritmo recebe necessariamente rótulos verdadeiros previamente conhecidos para cada observação.","E","Clusterização é tarefa não supervisionada."],["Ciência de Dados","K-means busca particionar observações em k grupos minimizando, em sua formulação clássica, a soma das distâncias quadráticas intra-cluster.","C","É o objetivo clássico do K-means."],["Ciência de Dados","Regras de associação são adequadas para descobrir relações de coocorrência, sendo suporte e confiança métricas tradicionais nesse contexto.","C","São métricas clássicas de association rule mining."],["Ciência de Dados","Detecção de anomalias busca identificar observações que se afastam significativamente do padrão predominante, podendo ser útil na seleção de casos para auditoria.","C","É uma aplicação típica."],["Ciência de Dados","Em validação cruzada k-fold, o conjunto de dados é dividido em k partes e o modelo é treinado e validado repetidamente, alternando a parte usada para validação.","C","Essa é a lógica do k-fold."],["Ciência de Dados","Vazamento de dados ocorre quando informações que não estariam disponíveis no momento da previsão entram no treinamento, podendo produzir avaliação artificialmente otimista.","C","É data leakage."],["Ciência de Dados","Em árvores de decisão, aumentar irrestritamente a profundidade sempre melhora a generalização porque cada nova divisão reduz o erro de treinamento sem aumentar variância.","E","Profundidade excessiva pode causar overfitting."],["Ciência de Dados","Random forest combina múltiplas árvores construídas com amostras e subconjuntos de atributos, buscando reduzir variância por agregação.","C","É a ideia de bagging e aleatoriedade de atributos."],["Ciência de Dados","Gradient boosting constrói modelos sequencialmente, em geral fazendo cada novo estimador atuar sobre erros ou resíduos do conjunto anterior.","C","É o princípio do boosting."],["Ciência de Dados","Em PCA, os componentes principais são combinações lineares ortogonais das variáveis e são ordenados pela variância explicada.","C","É a característica central da análise de componentes principais."],["Ciência de Dados","Em Big Data, volume, velocidade e variedade são dimensões clássicas do problema, mas não constituem uma definição que elimine a necessidade de qualidade e governança dos dados.","C","Os Vs não substituem governança e qualidade."],["Ciência de Dados","Data lake e data warehouse são estruturas necessariamente idênticas: ambas armazenam somente dados previamente modelados e limpos para relatórios.","E","Data lakes podem armazenar dados brutos e variados; warehouses tendem a ser mais estruturados."],["Ciência de Dados","Em BI, um dashboard pode sintetizar indicadores e permitir exploração interativa, mas a qualidade da decisão depende da qualidade dos dados e da definição adequada dos indicadores.","C","Visualização não corrige dados ruins."],["Ciência de Dados","Uma correlação elevada entre duas variáveis é suficiente para concluir que uma delas causa a outra, independentemente de confundidores ou desenho do estudo.","E","Correlação não estabelece causalidade por si só."],["Ciência de Dados","Em um modelo preditivo usado para fiscalização, métricas de desempenho devem ser avaliadas também por segmento quando diferenças entre grupos puderem ocultar degradação relevante em subpopulações.","C","Avaliação segmentada pode revelar problemas ocultos no desempenho agregado."],["Ciência de Dados","Dados abertos são necessariamente dados pessoais publicados sem restrição, desde que qualquer pessoa possa acessá-los gratuitamente.","E","Dados abertos podem ser não pessoais e devem observar requisitos legais e de licenciamento."],["Ciência de Dados","Metadados descrevem características dos dados, como origem, estrutura, tipo, periodicidade ou significado, e podem apoiar governança e integração.","C","Essa é a função dos metadados."],["Ciência de Dados","Integração de dados provenientes de fontes distintas exige atenção a chaves, formatos, semântica e qualidade, pois a simples concatenação de arquivos não garante consistência.","C","Integração é mais que juntar arquivos."],["Ciência de Dados","Em aprendizado de máquina, normalização ou padronização das variáveis pode ser importante para algoritmos sensíveis à escala, como métodos baseados em distância.","C","Escala afeta algoritmos como KNN e K-means."],["Ciência de Dados","A matriz de confusão de um classificador binário permite obter, entre outras, medidas como precisão, recall, especificidade e acurácia.","C","As métricas podem ser derivadas de TP, TN, FP e FN."]];

function render(){var frag=document.createDocumentFragment();currentBank.forEach(function(q){var c=document.createElement("article");c.className="card";var sm=document.createElement("div");sm.className="small";sm.textContent="Questão "+q.id+" · "+q.subject;var t=document.createElement("div");t.className="q";t.textContent=q.text;var row=document.createElement("div");["C","E","B"].forEach(function(v){var b=document.createElement("button");b.className="opt"+(answers[q.id]===v?" selected":"");b.textContent=v==="C"?"Certo":v==="E"?"Errado":"Em branco";b.addEventListener("click",function(){answers[q.id]=v;localStorage.setItem(currentKey,JSON.stringify(answers));Array.from(row.children).forEach(function(z){z.classList.remove("selected")});b.classList.add("selected");progress()});row.appendChild(b)});c.appendChild(sm);c.appendChild(t);c.appendChild(row);frag.appendChild(c)});quiz.innerHTML="";quiz.appendChild(frag);progress()}
document.getElementById("startBtn").addEventListener("click",function(){if(started)return;currentBank=qs;currentKey="nair_answers_1";try{answers=JSON.parse(localStorage.getItem(currentKey)||"{}")}catch(e){answers={}};document.getElementById("selectedInfo").textContent="1º Simulado selecionado.";started=true;paused=false;startBox.classList.add("hidden");quiz.classList.remove("hidden");finishBox.classList.remove("hidden");render()});
document.getElementById("startBtn2").addEventListener("click",function(){if(started)return;currentBank=qs2;currentKey="nair_answers_2";try{answers=JSON.parse(localStorage.getItem(currentKey)||"{}")}catch(e){answers={}};document.getElementById("selectedInfo").textContent="2º Simulado selecionado.";started=true;paused=false;startBox.classList.add("hidden");quiz.classList.remove("hidden");finishBox.classList.remove("hidden");render()});
document.getElementById("pauseBtn").addEventListener("click",function(){if(!started||finished)return;paused=!paused;this.textContent=paused?"Retomar":"Pausar"});
function finish(){if(finished)return;finished=true;paused=true;var ac=0,er=0,bl=0;currentBank.forEach(function(q){var v=answers[q.id]||"B";if(v==="B")bl++;else if(v===q.answer)ac++;else er++});var html="<div class='card result'><h2>Resultado</h2><h1>"+(ac-er)+" pontos líquidos</h1><p><b>Acertos:</b> "+ac+" · <b>Erros:</b> "+er+" · <b>Em branco:</b> "+bl+"</p><h3>Gabarito comentado</h3>";currentBank.forEach(function(q){var v=answers[q.id]||"B";html+="<div style='border-top:1px solid #ddd;padding:10px 0'><b>"+q.id+". "+q.subject+"</b> — Gabarito: "+(q.answer==="C"?"Certo":"Errado")+" · Sua resposta: "+(v==="C"?"Certo":v==="E"?"Errado":"Em branco")+"<br><span class='small'>"+q.comment+"</span></div>"});html+="</div>";result.innerHTML=html;result.classList.remove("hidden");finishBox.classList.add("hidden");window.scrollTo(0,0)}
document.getElementById("finishBtn").addEventListener("click",function(){if(confirm("Entregar o simulado agora?"))finish()});
setInterval(function(){if(!started||paused||finished)return;if(seconds>0){seconds--;clock()}else finish()},1000);clock();
})();
</script></body></html>
